<div
  class="d-flex flex-column justify-content-center align-items-center vh-100 "
>
  <div
    class="card shadow rounded-3 border-0 align-items-center"
    style="width: 480px; max-width: 95vw"
  >
    <div class="card-header bg-primary w-100 py-3 border-bottom d-flex justify-content-center border-primary-subtle">
      <i class="bi bi-shield-lock text-light" style="font-size: 8rem"></i>
    </div>
    <app-auth
      [config]="config"
      [loading]="loading"
      [errorMessage]="errorMessage"
      (formSubmit)="onSubmit($event)"
      class="w-100 card-body"
    >
    </app-auth>

    <div
      class="w-100 mt-3 py-3 card-footer bg-transparent border-top border-primary-subtle"
    >
      <a routerLink="/auth/register" class="btn btn-outline-primary w-100 fs-6">
        <i class="bi bi-person-plus-fill me-2"></i>
        Ainda não tem conta? Cadastre-se
      </a>
    </div>
  </div>
</div>
